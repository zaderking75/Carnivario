name: Publish RabbitAdmin Docker image

on:
  push:
    branches: [Develop, main, feature/auth-hibrida-msal-local, feature/ep3-rabbitmq-rabbitadmin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Disposable CI credentials, valid only for this loopback-bound test broker.
    env:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbitadmin_ci
      RABBITMQ_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
    services:
      rabbitmq:
        image: rabbitmq:4.2-management
        env:
          RABBITMQ_DEFAULT_USER: rabbitadmin_ci
          RABBITMQ_DEFAULT_PASS: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          - 127.0.0.1:5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: CarnivarioRabbitAdmin/pom.xml

      - name: Test RabbitAdmin
        working-directory: CarnivarioRabbitAdmin
        run: mvn -B clean test

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push RabbitAdmin
        uses: docker/build-push-action@v7
        with:
          context: ./CarnivarioRabbitAdmin
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carnivario-rabbitadmin:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/carnivario-rabbitadmin:latest', secrets.DOCKERHUB_USERNAME) || '' }}
