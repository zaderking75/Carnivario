name: Publish Docker images

on:
  push:
    branches: [Develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carnivario-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carnivario-${{ matrix.service }}:${{ github.sha }}

      - name: Build and push frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # Configuracion publica de Vite: se incorpora durante el build.
          build-args: |
            VITE_API_GATEWAY_URL=${{ vars.VITE_API_GATEWAY_URL || 'https://sioife5g10.execute-api.us-east-1.amazonaws.com/Deploy' }}
            VITE_AZURE_CLIENT_ID=${{ vars.VITE_AZURE_CLIENT_ID || '169c9415-d7d0-4892-8ccf-965f3f1a0dde' }}
            VITE_AZURE_TENANT_ID=${{ vars.VITE_AZURE_TENANT_ID || '3b914fe6-6475-4be6-8639-9de64b6ba898' }}
            VITE_AZURE_REDIRECT_URI=${{ vars.VITE_AZURE_REDIRECT_URI || 'https://3-212-230-250.sslip.io' }}
            VITE_AZURE_SCOPE_READ=${{ vars.VITE_AZURE_SCOPE_READ || 'api://169c9415-d7d0-4892-8ccf-965f3f1a0dde/Carnivario.Read' }}
            VITE_AZURE_SCOPE_WRITE=${{ vars.VITE_AZURE_SCOPE_WRITE || 'api://169c9415-d7d0-4892-8ccf-965f3f1a0dde/Carnivario.Write' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carnivario-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carnivario-frontend:${{ github.sha }}
