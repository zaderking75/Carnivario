# CarnivarioRabbitAdmin: al iniciar declara exchanges, colas y bindings en RabbitMQ.
# Solo accesible dentro del cluster (ClusterIP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitadmin
  template:
    metadata:
      labels:
        app: rabbitadmin
    spec:
      # Evita que Kubernetes inyecte RABBITMQ_PORT=tcp://... (por el Service "rabbitmq")
      enableServiceLinks: false
      containers:
        - name: rabbitadmin
          image: carnivario-rabbitadmin
          ports:
            - containerPort: 8082
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitadmin
spec:
  selector:
    app: rabbitadmin
  ports:
    - port: 8082
      targetPort: 8082
