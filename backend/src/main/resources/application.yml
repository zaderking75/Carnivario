spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://mysql-carnivario:3306/carnivario?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: carnivario
    password: carnivario
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
