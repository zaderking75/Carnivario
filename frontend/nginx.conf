server {
    listen 80;
    listen [::]:80;

    server_name 3-212-230-250.sslip.io;

    return 301 https://3-212-230-250.sslip.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name 3-212-230-250.sslip.io;

    ssl_certificate /etc/letsencrypt/live/3-212-230-250.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-212-230-250.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Mantener las imagenes relativas a traves de API Gateway (ruta publica /images/{proxy+}).
    location /images/ {
        proxy_pass https://sioife5g10.execute-api.us-east-1.amazonaws.com/Deploy/images/;
        proxy_ssl_server_name on;
        proxy_set_header Host sioife5g10.execute-api.us-east-1.amazonaws.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
